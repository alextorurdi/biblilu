<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 1120" role="img" aria-labelledby="title description">
<title id="title">El viaje del criado de Abraham: de Canaán a la Alta Mesopotamia</title>
<desc id="description">Mapa geográfico con costa mediterránea y cursos del Éufrates, Tigris y Jordán basados en Natural Earth. Harán se sitúa en Harran. El origen se representa como una región en el sur de Canaán, y la ciudad de Nacor como un destino incierto en la Alta Mesopotamia. El itinerario es orientativo.</desc>
<metadata>Base: Natural Earth 1:50m, public domain. https://www.naturalearthdata.com/ . Projection: equirectangular, standard parallel 35°N. Modern physical geography for orientation; no ancient route is asserted.</metadata>
