<title id="map-title">La promesa de la tierra, Génesis 15</title>
<desc id="map-desc">Mapa geográfico del Levante y norte de Egipto con contornos modernos de referencia. Señala Canaán, río Éufrates, brazo oriental del Nilo y wadi el-Arish como identificaciones alternativas del río de Egipto. No se traza una frontera territorial exacta.</desc>
