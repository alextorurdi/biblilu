<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 830" role="group" aria-label="Ascendencia de Isaac y Rebeca hasta Taré">
<title>Genealogía 19 · Isaac y Rebeca, ascendencia desde Taré</title>
<desc>Taré es padre de Abraham, Nacor y Harán. Abraham y Sara son padres de Isaac. Harán es padre de Milca, casada con Nacor; de su descendencia nace Betuel y de él Rebeca. La filiación de Sara respecto de Taré se representa como referencia discutida.</desc>
