<text x="610" y="47" text-anchor="middle" font-family="Georgia,serif" font-size="33" font-weight="bold" fill="#344d40">De Taré a Isaac y Rebeca</text>
<text x="610" y="78" text-anchor="middle" font-family="Arial" font-size="19" fill="#68776a">Génesis 11:26–29 · 20:12 · 21:3 · 22:20–23 · 24:15</text>
