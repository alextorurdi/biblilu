<svg xmlns="http://www.w3.org/2000/svg" width="820" height="960" viewBox="0 0 820 960" role="img" aria-labelledby="map-title map-desc">
<title id="map-title">El camino de Agar: Canaán, el desierto de Shur y Egipto</title>
<desc id="map-desc">Mapa editorial con costa geográfica real del Mediterráneo y la península del Sinaí, la región aproximada de Shur y un recorrido hipotético desde Hebrón. La ubicación de Bered y del Pozo del Viviente-que-me-ve es desconocida.</desc>
