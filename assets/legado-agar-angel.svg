<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 990" role="img" aria-labelledby="t d">
<title id="t">Agar junto a la fuente y el ángel de Jehová</title>
<desc id="d">Ilustración artística: Agar, con manto rojo oscuro, se encuentra arrodillada junto a un manantial del desierto frente a una figura angélica luminosa.</desc>
