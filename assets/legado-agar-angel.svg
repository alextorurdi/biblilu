<radialGradient id="glow"><stop stop-color="#f8f0bd" stop-opacity=".65"/><stop offset=".7" stop-color="#ffe6ab" stop-opacity=".19"/><stop offset="1" stop-color="#ffe6ab" stop-opacity="0"/></radialGradient>
<linearGradient id="water" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b9d6c6"/><stop offset="1" stop-color="#426d72"/></linearGradient>
