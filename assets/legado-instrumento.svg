<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 620" role="img" aria-labelledby="t d">
<title id="t">Representación artística de un instrumento cortante antiguo</title>
<desc id="d">Una hoja de piedra tallada con mango de madera y cordaje sobre una superficie de lino y arena, ilustración conceptual no identificada como utensilio arqueológico específico.</desc>
<defs>
<linearGradient id="linen" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7efe0"/><stop offset="1" stop-color="#d1b894"/></linearGradient>
<linearGradient id="flint" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e2d6bc"/><stop offset=".3" stop-color="#7f7970"/><stop offset=".65" stop-color="#a5a9a1"/><stop offset="1" stop-color="#333c40"/></linearGradient>
<linearGradient id="wood" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#bf8f5c"/><stop offset=".45" stop-color="#8c5d37"/><stop offset="1" stop-color="#4d392a"/></linearGradient>
<filter id="shadow"><feGaussianBlur stdDeviation="15"/></filter>
<filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".42" numOctaves="3" seed="6"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope=".05"/></feComponentTransfer></filter>
</defs>
