<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1180" role="img" aria-label="Esquema de 300 codos de largo, 50 de ancho y 30 de alto, con tres cubiertas"><defs>
 <linearGradient id="sky" x1="0" y1="0" x2="0.3" y2="1"><stop stop-color="#101e2a"/><stop offset=".4" stop-color="#36434b"/><stop offset=".7" stop-color="#c0a184"/><stop offset="1" stop-color="#efe0b7"/></linearGradient>
 <linearGradient id="dusk" x1="0" y1="0" x2=".75" y2="1"><stop stop-color="#101b27"/><stop offset=".5" stop-color="#47545a"/><stop offset="1" stop-color="#d4b28a"/></linearGradient>
 <linearGradient id="water" x1="0" y1="0" x2=".2" y2="1"><stop stop-color="#526665"/><stop offset=".45" stop-color="#263d40"/><stop offset="1" stop-color="#101d25"/></linearGradient>
 <linearGradient id="wood" x1="0" y1="0" x2=".8" y2=".5"><stop stop-color="#8e6547"/><stop offset=".35" stop-color="#bc8962"/><stop offset=".7" stop-color="#75503a"/><stop offset="1" stop-color="#3e2a25"/></linearGradient>
 <linearGradient id="land" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#a68b6c"/><stop offset="1" stop-color="#4a463c"/></linearGradient>
 <radialGradient id="glow"><stop stop-color="#f7e0ab" stop-opacity=".88"/><stop offset="1" stop-color="#f7e0ab" stop-opacity="0"/></radialGradient>
 <filter id="noise" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency=".009" numOctaves="4" seed="6" result="n"/><feColorMatrix in="n" type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope=".14"/></feComponentTransfer><feBlend in="SourceGraphic" mode="multiply"/></filter>
 <filter id="soft"><feGaussianBlur stdDeviation="22"/></filter>
 <pattern id="grain" width="36" height="17" patternUnits="userSpaceOnUse"><path d="M0 2H36M4 14H31" stroke="#2f221e" stroke-opacity=".23" stroke-width="2"/></pattern>
 </defs><rect width="900" height="1180" fill="#f2ede0"/><rect x="28" y="26" width="844" height="1128" fill="none" stroke="#aeac9a" stroke-width="2"/><text x="450" y="100" font-family="Georgia,serif" font-size="44" fill="#344d41" text-anchor="middle">Las medidas del arca</text><text x="450" y="148" font-size="22" font-family="Arial" fill="#77766a" text-anchor="middle">GÉNESIS 6:14–16 · ESQUEMA ORIENTATIVO</text><g transform="translate(50 235)"><path d="M60 378L607 239L777 304L242 480Z" fill="#ba9974" stroke="#4c493b" stroke-width="5"/><path d="M60 378L242 480L242 635L60 534Z" fill="#a48260" stroke="#4c493b" stroke-width="5"/><path d="M242 480L777 304L777 468L242 635Z" fill="#c7a483" stroke="#4c493b" stroke-width="5"/><path d="M242 534L777 363M242 584L777 414" stroke="#53483a" stroke-width="4"/><path d="M63 432L245 531M63 483L245 582" stroke="#53483a" stroke-width="4"/><path d="M60 610v-250M60 610l30 -10M60 360l30 -10M240 665L800 488M250 676l-7 -25M805 500l-9 -24" fill="none" stroke="#2d625b" stroke-width="4"/><text x="495" y="618" transform="rotate(-17 495 618)" text-anchor="middle" font-size="27" fill="#2d625b">300 codos · ≈135 m</text><text x="15" y="487" transform="rotate(-90 15 487)" font-size="25" text-anchor="middle" fill="#2d625b">30 codos</text><text x="91" y="310" transform="rotate(25 91 310)" font-size="25" fill="#2d625b">50 codos · ≈22,5 m</text></g><g font-family="Arial" fill="#344d41" text-anchor="middle"><text x="450" y="1022" font-size="29">Tres pisos · Una puerta lateral</text><text x="450" y="1067" font-size="21" fill="#726e62">1 codo ≈ 45 cm · dimensiones aproximadas</text></g></svg>