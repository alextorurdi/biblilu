name: Publicar apéndices de BIBLILU
on:
  push:
    branches: [main]
    paths:
      - 'data/tribus_nuevas.json'
      - 'assets/atlas/**'
      - 'assets/app.js'
      - 'assets/bibliography.js'
      - 'scripts/build_atlas.py'
      - 'scripts/build_bibliography.py'
      - 'scripts/check_bibliography.py'
      - 'scripts/build_atlas_relief.py'
      - 'scripts/check_atlas.py'
      - 'data/materiales_revision.json'
      - 'data/objetos_revision.json'
      - 'data/instrumentos_revision.json'
      - 'data/medidas_revision.json'
      - 'data/bibliography_apa7.json'
      - 'data/bibliography.json'
      - 'scripts/build.py'
      - 'assets/style.css'
      - 'editorial/approved-pages/**'
  workflow_dispatch:
concurrency:
  group: publicar-apendices-main
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  generar:
    # Los cambios editoriales de la Fase 3 no se publican automáticamente.
    # La publicación explícita continúa disponible en workflow_dispatch.
    if: github.event_name == 'workflow_dispatch' || !startsWith(github.event.head_commit.message, 'P3')
    runs-on: ubuntu-latest
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v7
        with:
          persist-credentials: true
      - name: Preparar relieve realista del atlas (si falta)
        run: |
          if [ ! -s assets/atlas/relieve.webp ]; then
            python3 -m pip install --quiet pillow "basemap-data==2.0.0"
            python3 scripts/build_atlas_relief.py
          fi
      - name: Generar páginas
        run: python3 scripts/build.py
      - name: Comprobar páginas del apéndice
        run: python3 -c "from pathlib import Path; p=Path('docs/apendices/animales'); assert len(list(p.glob('*/index.html'))) >= 35; assert 'Hechos bíblicos' in (p/'angeles/index.html').read_text(); assert 'species-photo' in (p/'higuera/index.html').read_text()"
      - name: Comprobar fichas de Objetos y símbolos
        run: python3 -c "from pathlib import Path; p=Path('docs/apendices/objetos'); assert len(list(p.glob('*/index.html'))) == 7; assert all('object-photo' in q.read_text() for q in p.glob('*/index.html')); assert 'object-index-mark' in (p/'index.html').read_text()"
      - name: Comprobar ausencia de menciones duplicadas
        run: >-
          python3 -c "from pathlib import Path;
          pages=list(Path('docs/apendices').glob('*/*/index.html'));
          duplicated=[str(p) for p in pages if '<h2>Referencias</h2>' in p.read_text(encoding='utf-8') and '<h2>Menciones bíblicas</h2>' in p.read_text(encoding='utf-8')];
          assert not duplicated, 'Apartados de referencias duplicados: '+', '.join(duplicated)"
      - name: Comprobar enlaces y listas de lectura
        run: >-
          python3 -c "from pathlib import Path;
          root=Path('docs/apendices');
          pages=list(root.glob('*/*/index.html'));
          doubled=[str(p) for p in pages if '<h2>En la lectura disponible</h2>' in p.read_text(encoding='utf-8') and ('<h2>Menciones bíblicas</h2>' in p.read_text(encoding='utf-8') or '<h2>Referencias</h2>' in p.read_text(encoding='utf-8'))];
          assert not doubled, 'Listas de lectura repetidas: '+', '.join(doubled);
          abimelec=(root/'onomastico/abimelec/index.html').read_text(encoding='utf-8');
          assert '<h2>En la lectura disponible</h2>' not in abimelec;
          assert 'genesis/20/index.html#gn-20-1' in abimelec;
          assert 'Gn 26:1-11' in abimelec;
          mamre=(root/'lugares/mamre/index.html').read_text(encoding='utf-8');
          assert '<h2>En la lectura disponible</h2>' in mamre"
      - name: Comprobar fichas y enlaces de instrumentos
        run: >-
          python3 -c "from pathlib import Path;
          root=Path('docs/apendices/instrumentos');
          pages=[root/'kinnor/index.html',root/'ugab/index.html'];
          assert all(p.exists() for p in pages);
          assert all('instrument-photo' in p.read_text(encoding='utf-8') and '<h2>Referencias</h2>' in p.read_text(encoding='utf-8') and 'onomastico/jubal/index.html' in p.read_text(encoding='utf-8') for p in pages);
          assert all('<h2>Menciones bíblicas</h2>' not in p.read_text(encoding='utf-8') for p in pages);
          scene=Path('docs/genesis/4/index.html').read_text(encoding='utf-8');
          assert scene.count('data-entry=&quot;instrumentos/kinnor&quot;')==0;
          assert scene.count('data-entry=\"instrumentos/kinnor\"')==2 and scene.count('data-entry=\"instrumentos/ugab\"')==2;
          assert '<small class=\"instrument-index-original\"' in (root/'index.html').read_text(encoding='utf-8')"
      - name: Comprobar emblema y recortes musicales
        run: >-
          python3 -c "from pathlib import Path;
          ap=Path('docs/apendices/instrumentos');
          ix=(ap/'index.html').read_text(encoding='utf-8');
          assert ix.count('instrument-index-mark')==2 and ix.count('Lira: ficha ilustrada')==2;
          for_name=['kinnor','ugab'];
          assert all(('instrumentos-'+n+'.svg') in (ap/n/'index.html').read_text(encoding='utf-8') for n in for_name);
          assert all((Path('docs/assets')/('instrumentos-'+n+'.svg')).exists() for n in for_name);
          assert all((Path('docs/assets')/('instrumentos-'+n+'.svg')).read_text(encoding='utf-8').count('<g transform=')==1 for n in for_name);
          scene=Path('docs/genesis/4/index.html').read_text(encoding='utf-8');
          assert scene.count('src=\"../../assets/instrumentos.svg\"')>=1"
      - name: Comprobar las tres fichas de Pesos, medidas y monedas
        run: >-
          python3 -c "from pathlib import Path;
          root=Path('docs/apendices/medidas');
          fichas=[root/(n+'/index.html') for n in ['codo','sea','siclo']];
          assert all(p.exists() for p in fichas), 'Falta alguna ficha de medidas';
          assert all(all('<h2>'+section+'</h2>' in p.read_text(encoding='utf-8') for section in ['Hechos bíblicos','Equivalencias y usos','Etimología','Referencias']) for p in fichas);
          assert all('<h2>Menciones bíblicas</h2>' not in p.read_text(encoding='utf-8') for p in fichas);
          assert '<table class=\"measure-equivalences\"' in fichas[2].read_text(encoding='utf-8');
          index=(root/'index.html').read_text(encoding='utf-8');
          assert '3 entradas' in index and index.index('href=\"codo/index.html\"') < index.index('href=\"sea/index.html\"') < index.index('href=\"siclo/index.html\"');
          diluvio=Path('docs/genesis/6/index.html').read_text(encoding='utf-8');
          perdicion=Path('docs/genesis/18/index.html').read_text(encoding='utf-8');
          assert diluvio.count('data-entry=\"medidas/codo\"')==6 and 'id=\"fn-60\"' in diluvio;
          assert perdicion.count('data-entry=\"medidas/sea\"')==1;
          assert 'data-entry=\"medidas/siclo\"' in Path('docs/genesis/20/index.html').read_text(encoding='utf-8');
          assert 'data-entry=\"medidas/siclo\"' in Path('docs/genesis/24/index.html').read_text(encoding='utf-8')"
      - name: Comprobar reglas en índice de medidas
        run: >-
          python3 -c "from pathlib import Path;
          p=Path('docs/apendices/medidas/index.html');
          s=p.read_text(encoding='utf-8');
          assert s.count('class=\"measure-index-mark\"') == 3;
          assert s.count('aria-label=\"Regla: unidad de medida\"') == 3;
          assert all('href=\"'+item+'/index.html\"' in s for item in ['codo','sea','siclo'])"
      - name: Comprobar Atlas de Pueblos
        run: |
          python3 scripts/check_atlas.py
          node --check assets/atlas/visor.js
          node --check assets/app.js
      - name: Comprobar Bibliografía APA 7 y enlaces
        run: |
          python3 scripts/check_bibliography.py
          node --check assets/bibliography.js
      - name: Publicar ficheros estáticos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/atlas/relieve.webp docs/apendices docs/assets/atlas docs/assets/app.js docs/assets/bibliography.js docs/assets/entries.json docs/assets/instrumentos-kinnor.svg docs/assets/instrumentos-ugab.svg docs/bibliografia/index.html docs/assets/style.css docs/index.html docs/genesis/2/index.html docs/genesis/4/index.html docs/genesis/6/index.html docs/genesis/11/index.html docs/genesis/18/index.html docs/genesis/20/index.html docs/genesis/24/index.html
          git rm -f --ignore-unmatch docs/apendices/animales/legumbres/index.html
          if ! git diff --cached --quiet; then
            git commit -m "Publicar reorganización de los apéndices de BIBLILU"
            # No forzar ni sobreescribir cambios editoriales ajenos.
            # Rebasar siempre sobre la punta más reciente y reintentar
            # cuando otro proceso publique entre fetch y push.
            for intento in 1 2 3 4 5; do
              git fetch origin main
              # El generador puede dejar archivos rastreados sin preparar.
              # Git guarda y recupera esos cambios durante el rebase.
              git -c rebase.autoStash=true rebase origin/main
              if git push origin HEAD:main; then
                echo "Publicación sincronizada en el intento $intento"
                exit 0
              fi
              echo "La rama main cambió durante el push (intento $intento); reintentando..."
              sleep 3
            done
            echo "::error::No se pudo sincronizar la publicación tras cinco intentos"
            exit 1
          fi
