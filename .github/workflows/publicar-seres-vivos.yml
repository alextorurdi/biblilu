name: Publicar apéndices de BIBLILU
on:
  push:
    branches: [main]
    paths:
      - 'data/entries.json'
      - 'data/bibliography.json'
      - 'scripts/build.py'
      - 'assets/style.css'
      - 'editorial/approved-pages/**'
      - '.github/workflows/publicar-seres-vivos.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Generar páginas
        run: python3 scripts/build.py
      - name: Comprobar páginas del apéndice
        run: python3 -c "from pathlib import Path; p=Path('docs/apendices/animales'); assert len(list(p.glob('*/index.html'))) >= 35; assert 'Hechos bíblicos' in (p/'angeles/index.html').read_text(); assert 'species-photo' in (p/'higuera/index.html').read_text()"
      - name: Publicar ficheros estáticos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/apendices docs/assets/entries.json docs/bibliografia/index.html docs/assets/style.css docs/index.html docs/genesis/2/index.html docs/genesis/11/index.html docs/genesis/20/index.html docs/genesis/24/index.html
          git rm -f --ignore-unmatch docs/apendices/animales/legumbres/index.html
          if ! git diff --cached --quiet; then
            git commit -m "Publicar reorganización de los apéndices de BIBLILU"
            git push
          fi
