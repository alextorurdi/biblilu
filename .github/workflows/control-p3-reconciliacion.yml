name: P3 · Control de reconciliación Génesis 25–50
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/control-p3-reconciliacion.yml'
      - 'scripts/check_p3_reconciliacion.py'
      - 'scripts/check_p3_cobertura_lexica.py'
      - 'scripts/build_p3_catalogo_reconciliado.py'
      - 'data/p3-reconciliacion-genesis-25-50.json'
      - 'data/p3-catalogo-reconciliado-genesis-25-50.json'
      - 'data/p3-extracciones-genesis-25-50.json'
      - 'data/genesis_25_50_bes.json'
      - 'data/registro_maestro.json'
  workflow_dispatch:
# Evitar controles simultáneos sobre distintas revisiones de reglas/catálogo.
concurrency:
  group: p3-reconciliacion-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  control-p3:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v7
      - name: Validar reconciliación contextual
        run: python3 scripts/check_p3_reconciliacion.py
      - name: Control de cobertura léxica dirigida CT-32
        run: python3 scripts/check_p3_cobertura_lexica.py
      - name: Verificar reproducibilidad del catálogo derivado
        run: |
          python3 scripts/build_p3_catalogo_reconciliado.py --check
          # Si divergen reglas y catálogo, indicar la solución en el log.
          echo "Catálogo y reglas reproducibles: P3 OK"
      - name: Asegurar que solo se validan archivos
        run: |
          git diff --exit-code -- data/genesis_25_50_bes.json data/p3-extracciones-genesis-25-50.json data/registro_maestro.json
