name: Preparar Fase 2 BES · 19 borradores sin publicar
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/preparar-p2-bes.yml'
      - 'scripts/marcar_dialogos_bes_p2.py'
      - 'scripts/test_marcado_bes_p2.py'
      - 'scripts/prepare_genesis_p2.py'
      - 'scripts/auditar_fase2_bes.py'
      - 'data/genesis_25_50_bes.json'
      - 'editorial/p2-parrafos-genesis-25-50.json'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: preparar-p2-bes
  cancel-in-progress: false
jobs:
  borradores:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Obtener fuentes
        uses: actions/checkout@v7
        with:
          persist-credentials: true
      - name: Proteger RVR1960 y escenas publicadas
        run: |
          sha256sum data/genesis.json > /tmp/genesis-rvr1960.sha
          find editorial/approved-pages/genesis -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/escenas-rvr1960.sha
          find docs/genesis -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/docs-genesis.sha
      - name: Marcar 874 versículos BES y crear informe de revisión
        run: |
          python3 scripts/marcar_dialogos_bes_p2.py
          python3 scripts/prepare_genesis_p2.py --check-source
          python3 scripts/prepare_genesis_p2.py --check-format
          python3 scripts/test_marcado_bes_p2.py
          python3 scripts/test_genesis_p2.py
      - name: Generar en build/p2 los 19 borradores e índices
        run: |
          python3 scripts/prepare_genesis_p2.py --build-draft
          python3 - <<'PY'
          import json
          from pathlib import Path
          base=Path('build/p2')
          p=list((base/'genesis').glob('*/index.html'))
          assert len(p)==19, len(p)
          assert sum(x.read_text().count('<span class="verse-inline" id="gn-') for x in p)==874
          assert sum(x.read_text().count('<p class="prose-paragraph') for x in p)==387
          assert sum(x.read_text().count('class="p2-spoken-dash"') for x in p)==299
          assert (base/'assets/p2-prose.css').is_file()
          assert json.loads((base/'validacion.json').read_text())['parrafos']==387
          assert json.loads((base/'validacion.json').read_text())['con_formato_revisado']==0
          assert all('noindex,nofollow' in x.read_text() for x in p)
          assert (base/'genesis/index.html').is_file()
          print('Borradores verificados: 19 escenas, 387 párrafos y 874 versículos; solo en build/p2.')
          PY
      - name: Auditoría exhaustiva de BES oficial, HTML, enlaces y apéndices
        run: |
          python3 scripts/auditar_fase2_bes.py --online
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('build/p2/auditoria-p2.json').read_text(encoding='utf-8'))
          assert p['estado']=='controles_automaticos_superados'
          assert p['texto']['fuente_oficial']['versiculos_comparados']==874
          assert p['navegacion']['enlaces_rotos']==[]
          assert p['apendices']['rutas_fichas_existentes']==450
          print('Auditoría final confirmada: fuente oficial, 874 versículos, navegación sin enlaces internos rotos.')
          PY
      - name: Confirmar integridad de las quince escenas antiguas
        run: |
          sha256sum --check --status /tmp/genesis-rvr1960.sha
          sha256sum --check --status /tmp/escenas-rvr1960.sha
          sha256sum --check --status /tmp/docs-genesis.sha
      - name: Guardar revisión y páginas como artefacto privado, no sitio
        uses: actions/upload-artifact@v7
        with:
          name: biblilu-borradores-bes-p2
          path: |
            build/p2/
            editorial/p2-revision-dialogos-genesis-25-50.json
          retention-days: 14
      - name: Registrar únicamente datos y revisión editorial, NO publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/genesis_25_50_bes_formato.json editorial/p2-revision-dialogos-genesis-25-50.json
          if ! git diff --cached --quiet; then
            git commit -m "Preparar 874 versículos BES con diálogo y voces divinas (borrador P2)"
            git push
          fi
