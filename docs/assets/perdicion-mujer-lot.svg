<!-- airborne salt particles -->
<g fill="#f0f4e9" opacity=".75"><circle cx="291" cy="532" r="5"/><circle cx="244" cy="671" r="3"/><circle cx="626" cy="547" r="5"/><circle cx="675" cy="745" r="4"/><circle cx="356" cy="392" r="3"/><circle cx="583" cy="390" r="5"/><circle cx="695" cy="890" r="3"/><circle cx="230" cy="901" r="5"/></g>
<path d="M0 1133Q213 1092 399 1140T920 1080V1160H0Z" fill="#5e5852" opacity=".17"/>
<rect width="920" height="1160" filter="url(#grain)" opacity=".75"/>
</svg>