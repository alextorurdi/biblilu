<path d="M365 467Q329 541 329 669L266 839M518 467Q564 543 574 678L623 832" stroke="#cfd8ce" stroke-width="47" fill="none" stroke-linecap="round"/>
<path d="M261 827q-21 32-10 53M619 825q30 35 16 56" stroke="#eff0e8" stroke-width="23" fill="none" stroke-linecap="round"/>
