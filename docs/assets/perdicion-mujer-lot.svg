<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 1160" role="img" aria-labelledby="t d">
<title id="t">La mujer de Lot, convertida en estatua de sal</title>
<desc id="d">Ilustración editorial original de una mujer que se vuelve hacia la llanura y se transforma en una escultura blanquecina de sal. Atmósfera desértica y siluetas de montaña, sin identificar una formación geológica concreta.</desc>
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#252e36"/><stop offset=".4" stop-color="#695f61"/><stop offset=".76" stop-color="#c3a58e"/><stop offset="1" stop-color="#ddbd9b"/></linearGradient>
<radialGradient id="glow"><stop stop-color="#f7e1ad" stop-opacity=".6"/><stop offset=".52" stop-color="#dec29f" stop-opacity=".17"/><stop offset="1" stop-color="#dec29f" stop-opacity="0"/></radialGradient>
<linearGradient id="hill" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a78c7d"/><stop offset=".7" stop-color="#755e5b"/><stop offset="1" stop-color="#554d4e"/></linearGradient>
<linearGradient id="salt" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#fcf7ed"/><stop offset=".25" stop-color="#dedfd7"/><stop offset=".51" stop-color="#a5b5b2"/><stop offset=".72" stop-color="#f2efe2"/><stop offset="1" stop-color="#778f96"/></linearGradient>
<linearGradient id="cloth" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d4c8b6"/><stop offset=".55" stop-color="#a9a99e"/><stop offset="1" stop-color="#6c7470"/></linearGradient>
<filter id="blur"><feGaussianBlur stdDeviation="21"/></filter>
<filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".25" numOctaves="3" seed="3"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope=".09"/></feComponentTransfer></filter>
</defs>
<rect width="920" height="1160" fill="url(#sky)"/>
<circle cx="200" cy="420" r="300" fill="url(#glow)"/>
<path d="M0 620Q145 541 267 599T510 562T920 589V1160H0Z" fill="#aa8a79" opacity=".75"/>
<path d="M0 737Q216 651 386 709T666 668T920 691V1160H0Z" fill="url(#hill)"/>
<path d="M0 863Q260 786 416 835T920 807V1160H0Z" fill="#8b7567"/>
<path d="M0 977Q235 923 459 973T920 911V1160H0Z" fill="#74665d"/>
<!-- distant haze and diffuse smoke -->
<path d="M42 604Q63 552 118 543Q84 495 147 477Q108 423 175 398Q147 358 204 315" fill="none" stroke="#3c3e46" stroke-width="91" opacity=".18" filter="url(#blur)"/>
<path d="M278 640Q260 546 289 498Q270 445 308 420" fill="none" stroke="#45434a" stroke-width="53" opacity=".17" filter="url(#blur)"/>
<path d="M0 866Q193 824 316 858T585 814L920 855" stroke="#cab09a" stroke-width="6" opacity=".3" fill="none"/>
<!-- mineral deposit at base -->
<path d="M252 1059Q331 1000 425 1017L503 1072Q616 1077 655 1120L720 1160H198Z" fill="#d9dfd4" opacity=".87"/>
<path d="M223 1135l64-63 96 48 62-82 81 78 71-47 98 91" fill="none" stroke="#eff0e8" stroke-width="16" opacity=".76"/>
<!-- full figure statue -->
<path d="M398 331Q388 285 425 267Q447 248 486 258Q524 287 518 338L502 379L466 410L423 383Z" fill="url(#salt)" stroke="#879391" stroke-width="7"/>
<!-- turned face -->
<path d="M408 298Q382 304 377 333L402 343Q410 365 432 367" stroke="#748a8c" stroke-width="5" fill="#e9e7d9"/>
<path d="M421 318l-15 4m4 22l20 1" stroke="#7d8d8b" stroke-width="3" opacity=".85"/>
<!-- veil -->
<path d="M433 252Q370 258 371 320Q349 376 375 456L413 491L452 373L504 394Q537 330 503 271Z" fill="url(#cloth)" stroke="#a2a79d" stroke-width="6"/>
<path d="M428 266Q399 335 417 425M475 270Q517 349 480 418" fill="none" stroke="#f2f1e9" stroke-width="9" opacity=".55"/>
<!-- skirt body -->
<path d="M416 403Q350 415 318 499Q306 617 298 727L222 1043Q356 1148 647 1045L566 723Q560 572 524 465L494 400Z" fill="url(#salt)" stroke="#899b9b" stroke-width="8"/>
