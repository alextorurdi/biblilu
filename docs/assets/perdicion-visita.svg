<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 1160" role="img" aria-labelledby="t d">
<title id="t">La visita: Abraham recibe a los tres visitantes</title><desc id="d">Ilustración editorial original de tres visitantes vestidos con túnicas antiguas acercándose a la tienda de Abraham bajo un encinar al atardecer. Sin marco ornamental.</desc>
<defs>
 <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#394d56"/><stop offset=".37" stop-color="#c29677"/><stop offset=".75" stop-color="#e8c89b"/><stop offset="1" stop-color="#dbb482"/></linearGradient>
 <radialGradient id="sun"><stop stop-color="#fff4c0" stop-opacity=".9"/><stop offset=".38" stop-color="#ffebbc" stop-opacity=".35"/><stop offset="1" stop-color="#ffe8be" stop-opacity="0"/></radialGradient>
