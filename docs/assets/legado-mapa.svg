<title id="title">Mapa esquemático de Canaán, Shur, Cades y Bered</title>
<desc id="desc">La ruta de Agar hacia Egipto y las localidades de Cades y Bered se muestran de forma aproximada; la localización antigua no se conoce con certeza.</desc>
