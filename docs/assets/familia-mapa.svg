<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 1120" role="img" aria-labelledby="title description"><title id="title">El viaje del criado de Abraham a Mesopotamia</title><desc id="description">Mapa interpretativo desde el sur de Canaán hasta el norte de Mesopotamia. La ruta es aproximada y la ciudad de Nacor no posee localización segura.</desc>
